# Render 声明式部署配置 —— 玖能官网 v0.4(免费层 Node + Python 服务)

# 用法:
#   1. 把本项目推送到 GitHub 仓库(如 github.com/miiinniam/jiuneng-website)
#   2. Render Dashboard → New → Blueprint → 选择该仓库
#   3. Render 读取本文件创建**两个**服务:
#        jiuneng-website      —— 官网(Node,含 /ai 页、AI 询价接口、测算接口)
#        jiuneng-osrm-engine  —— 测算引擎(OSRM++ 窄暴露入口)
#   4. 密钥全部自动化,版本库和任何人都不需要经手密钥值:
#        ENGINE_API_KEY    : generateValue=true → Render 生成 256 位随机值
#        OSRM_ENGINE_KEY   : fromService        → 自动引用上面那把钥匙(两侧永远一致)
#        GEMINI_API_KEY    : sync=false         → 唯一人工项,首次创建时面板会提示填写
#   5. ⚠️ 改本文件**不会**自动新建服务(免费层 Blueprint 未开推送同步):
#      必须进 Render Dashboard → Blueprint → **Sync** 才会应用。
#      详见 docs/plans/2026-09-25-engine-trustworthiness.md「上线门槛」。

services:
  - type: web
    name: jiuneng-website
    runtime: node
    repo: https://github.com/miiinniam/jiuneng-website
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    # 自定义域名(声明式):Render 会自动签发/续期 TLS,并把 HTTP 重定向到 HTTPS。
    # 对应 DNS:site → jiuneng-website.onrender.com(Godaddy 已配)。根域/www 属 OSRM++ 项目,不在此声明。
    domains:
      - site.jiuneng.space
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false  # 唯一人工项:Google AI Studio 的 key,勿提交到仓库
      - key: APP_URL
        value: https://site.jiuneng.space  # 站点公网地址(自引用链接用)
      - key: OSRM_API_BASE
        value: https://jiuneng-osrm-engine.onrender.com
        # 必须带协议头:官网侧只补 /api/v1、不补 https://(只写主机名会静默失败)
      - key: OSRM_ENGINE_KEY
        fromService:           # 自动引用引擎侧的钥匙 —— 不需要人工对齐两侧
          type: web
          name: jiuneng-osrm-engine
          envVarKey: ENGINE_API_KEY
      - key: HEALTH_PROBE_MS
        value: "0"
        # 0 = 关闭后台周期探查(也是代码默认值):免费层「每工作区 750 实例小时/月」,
        # 周期探查会 24/7 把引擎叫醒 → 两个常驻服务 ≈1440h/月,月中必然被暂停全部免费服务。
        # 引擎改由真实测算请求按需唤醒(休眠时首个测算慢 30–60s)。
      - key: OSRM_QUOTE_TIMEOUT_MS
        value: "75000"
        # 冷启动等待上限(默认 75s):前端 fetch 无独立超时,这里是端到端唯一的等待上限;
        # 给足才能「等出」休眠引擎的首次结果,而不是误报 engine_timeout。

  # ── 测算引擎(OSRM++ 的窄暴露入口) ──────────────────────────────
  # 只放行 GET /health 与 POST /api/v1/route/cost,其余端点一律 404;
  # 必须带 X-API-Key,密钥取自 ENGINE_API_KEY(未配置则拒绝启动)。
  # 代码与数据由 `npm run sync:engine` 从 AIOSRM++ 同步到 deploy/osrm-engine/,
  # 排除表硬性剔除公司印章/签名/真实 API Key/银行账号/审计文件。
  - type: web
    name: jiuneng-osrm-engine
    runtime: python
    repo: https://github.com/miiinniam/jiuneng-website
    rootDir: deploy/osrm-engine
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: ENGINE_API_KEY
        generateValue: true   # Render 生成 256 位随机值;站点侧 OSRM_ENGINE_KEY 自动引用
      - key: ENGINE_RATE_LIMIT
        value: "60"  # 每 IP 每分钟最大请求数
      - key: PYTHON_VERSION
        value: "3.11.9"  # 全限定版本(Render 要求);本地引擎实测解释器 3.11.15,同大版本
      - key: OSRM_RESOURCE_DIR
        value: /opt/render/project/src/deploy/osrm-engine  # 数据目录(可写,重启后回到仓库版本)
